[project]
name = "fio-backend"
version = "0.1.0"
description = "Fio — chamados com as palavras do cliente"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "dj-database-url>=2.1",
    "imap-tools>=1.7",
    "cryptography>=43",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fio.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["imap: precisa de credencial IMAP de verdade na caixa configurada."]
addopts = '-m "not imap"' 

[tool.setuptools]
packages = ["fio", "core", "ingest", "api"]
