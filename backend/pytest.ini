[pytest]
DJANGO_SETTINGS_MODULE = fio.settings
python_files = test_*.py
testpaths = tests
markers =
    imap: precisa de credencial IMAP de verdade na caixa configurada.
# O teste de conexão real fica de fora por padrão — CI não tem credencial.
# Para rodá-lo:  pytest -m imap
addopts = -m "not imap"
